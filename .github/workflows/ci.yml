name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: nscloud-ubuntu-24.04-amd64-4x8
    steps:
      - name: Check out Git repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: 🏗 Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Lint all workspaces
        run: pnpm run lint

  typecheck:
    runs-on: nscloud-ubuntu-24.04-amd64-4x8
    steps:
      - name: Check out Git repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: 🏗 Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Check that TypeScript compiles in all workspaces
        run: pnpm run typecheck

  test:
    runs-on: nscloud-ubuntu-24.04-amd64-4x8
    steps:
      - name: Check out Git repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: 🏗 Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Run tests in all workspaces
        run: pnpm run test

  audit:
    runs-on: nscloud-ubuntu-24.04-amd64-4x8
    steps:
      - name: Check out Git repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: 🏗 Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Audit NPM dependencies
        run: pnpm audit --prod

  mobile-provider:
    runs-on: nscloud-ubuntu-24.04-amd64-4x8
    steps:
      - name: Check out Git repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: 🏗 Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Build mobile dApp provider and verify UMD artifact
        working-directory: apps/mobile-wallet
        run: |
          pnpm exec turbo build:deps
          node -e "require.resolve('@alephium/wallet-dapp-provider/lib/provider.umd.json')"

  build-desktop-wallet:
    needs: [typecheck]
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: nscloud-macos-tahoe-arm64-6x14
            platform: macos
          - os: nscloud-ubuntu-24.04-amd64-4x8
            platform: ubuntu
          - os: nscloud-windows-2022-amd64-4x8
            platform: windows

    steps:
      - name: Check out Git repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: 🏗 Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Skip desktop wallet signing
        uses: jaywcjlove/github-action-package@6fb8b5f918c1cb2eb3e0416d5b9f45cd4af6ed16 # v2.0.0
        with:
          path: apps/desktop-wallet/package.json
          unset: build.win.sign

      - name: Building desktop wallet on ${{ matrix.platform }}
        run: cd apps/desktop-wallet && pnpm run ci:build:electron:${{ matrix.platform }}
